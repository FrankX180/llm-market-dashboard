name: update-dashboard
on:
  schedule:
    # Daily Taiwan 08:40 = UTC 00:40
    # Mon: OpenRouter usage + SDLLMTK price; Tue-Sun: SDLLMTK price only
    - cron: "40 0 * * 1"
    - cron: "40 0 * * 2,3,4,5,6,0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # 兩個 run 同時跑時，後跑的 push 會被拒（2026-11-26 實測 rejected: fetch first）。
  # 排隊不取消：前一個先把資料 commit 上去，後一個 checkout 到新資料後多半 no change。
  group: update-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch OpenRouter usage (Monday or manual)
        if: ${{ github.event.schedule == '40 0 * * 1' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        run: python scripts/fetch_openrouter_daily.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Update dashboard (SDLLMTK price daily)
        run: python scripts/update_market_triple.py --skip-mm
        env:
          # optional: portal login token -> official 4-decimal API instead of the
          # public product-page fallback. Leave unset to use the fallback.
          SILICONDATA_API_TOKEN: ${{ secrets.SILICONDATA_API_TOKEN }}
      - name: Publish index.html and price CSV
        run: |
          cp scripts/market_triple_dashboard.html index.html
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "origin/master moved after this run started (overlapping run); skipping publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add one by one: a single missing path makes `git add a b c` fail as a whole,
          # which silently skips the commit and leaves a green job with stale data
          for f in index.html scripts/sdllmtk_daily.csv scripts/openrouter_usage_daily.csv \
                   scripts/expenditure_proxy_daily.csv scripts/expenditure_proxy_weekly.csv \
                   scripts/market_triple_meta.json; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "dashboard update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git push; then
            exit 0
          fi
          # push rejected: another run pushed after we checked out (schedule + manual overlap)
          git fetch origin master
          if git diff --quiet HEAD origin/master; then
            echo "another run already published identical content"
            exit 0
          fi
          if ! git pull --rebase --autostash origin master; then
            echo "rebase conflict: overlapping run already published this window; keeping remote"
            git rebase --abort || true
            exit 0
          fi
          git push
