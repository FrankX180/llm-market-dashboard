name: update-dashboard
# 2026-09-28 停排程（Cyndi）
# 本 repo 為舊站殘留：對外公開站已於 2026-08-17 遷至 fxgame888-boop/llm-market-dashboard
# （帳號改名後為 novaevo905）。為避免兩站各自抓取造成資料漂移，並止住
# 每週一 401 失敗通知噪音，移除全部 schedule。
# 需要補資料時用 Actions -> update-dashboard -> Run workflow 手動觸發（下面仍保留）。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch OpenRouter usage (weekly Monday)
        if: ${{ github.event.schedule == '40 0 * * 1' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_openrouter_daily.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Update dashboard (SDLLMTK price daily)
        run: python scripts/update_market_triple.py --skip-mm
      - name: Publish index.html
        run: |
          cp scripts/market_triple_dashboard.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # usage CSV 必須進版控：週二～日不跑 fetch，靠 checkout 帶下來的 CSV 才有第二張圖
          git add index.html scripts/openrouter_usage_daily.csv
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "dashboard update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
